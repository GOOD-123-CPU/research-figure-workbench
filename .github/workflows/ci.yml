name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  toolchain-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python helpers
        run: python -m compileall -q scripts

      - name: Render synthetic figure
        run: python scripts/smoke_render.py --out /tmp/research-figure-workbench-smoke

      - name: Preflight PDF
        run: python scripts/preflight_figure.py /tmp/research-figure-workbench-smoke/smoke_figure.pdf --strict --expected-width-mm 180 --expected-height-mm 62

      - name: Preflight SVG
        run: python scripts/preflight_figure.py /tmp/research-figure-workbench-smoke/smoke_figure.svg --strict --expected-width-mm 180 --expected-height-mm 62

      - name: Preflight PNG
        run: python scripts/preflight_figure.py /tmp/research-figure-workbench-smoke/smoke_figure.png --strict --min-dpi 300 --expected-width-mm 180 --expected-height-mm 62
